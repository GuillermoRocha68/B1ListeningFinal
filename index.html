<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Rocha's English Class: B1 Listening Test</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- html2pdf.js for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <meta name="color-scheme" content="dark">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        primary: '#00F0FF',
                        secondary: '#B026FF',
                        dark: '#050510',
                        card: '#131A2A',
                        accent: '#00FF9F',
                        danger: '#FF003C',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050510;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(176, 38, 255, 0.1), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.15), transparent 25%),
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: #e2e8f0;
        }
        .glass-panel {
            background: rgba(19, 26, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
        }
        .futuristic-border {
            position: relative;
        }
        .futuristic-border::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00F0FF, #B026FF, #00F0FF);
            background-size: 200% auto;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 0 15px #00F0FF;
            animation: gradientMove 3s linear infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        
        /* Custom Audio Player Styling */
        audio {
            width: 100%;
            height: 40px;
            border-radius: 8px;
            outline: none;
            filter: invert(90%) hue-rotate(180deg);
        }

        /* PDF specific styles */
        #pdf-container {
            display: none;
        }
        .pdf-mode #pdf-container {
            display: block;
            background: #050510;
            padding: 40px;
            width: 100%;
            color: #e2e8f0;
        }
        .pdf-page-break {
            page-break-before: always;
        }
        
        /* Bar Chart Animation */
        @keyframes growUp {
            from { height: 0; }
        }
        .animate-bar {
            animation: growUp 1s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DATA & KEYS ---
        const ANSWER_KEYS = {
            1: 'B', 2: 'B', 3: 'A', 4: 'C', 5: 'B', 6: 'B', 7: 'C',
            8: 'A', 9: 'B', 10: 'C', 11: 'A', 12: 'A', 13: 'A',
            20: 'C', 21: 'A', 22: 'B', 23: 'A', 24: 'A', 25: 'C'
        };

        const checkPart3Answer = (num, val) => {
            if(!val) return false;
            const text = val.toLowerCase().trim();
            switch(num) {
                case 14: return text.includes('waterfall');
                case 15: return text.includes('shark');
                case 16: return text.includes('horse');
                case 17: return text.includes('musical') || text.includes('show') || text.includes('play');
                case 18: return text.includes('sugar');
                case 19: return text.includes('ring');
                default: return false;
            }
        };

        const TOTAL_QUESTIONS = 25;
        const SECTION_QUESTIONS = {
            1: [1,2,3,4,5,6,7],
            2: [8,9,10,11,12,13],
            3: [14,15,16,17,18,19],
            4: [20,21,22,23,24,25]
        };

        const App = () => {
            const [step, setStep] = useState(0); // 0: Intro, 1-4: Parts, 5: Results
            const [user, setUser] = useState({ name: '', date: '' });
            const [answers, setAnswers] = useState({});
            const [checkedStatus, setCheckedStatus] = useState({ 1: false, 2: false, 3: false, 4: false });
            const [timeLeft, setTimeLeft] = useState(40 * 60); // 40 minutes in seconds
            const [timerActive, setTimerActive] = useState(false);
            const [resultsData, setResultsData] = useState(null);
            const [generatingPDF, setGeneratingPDF] = useState(false);

            // Timer Logic
            useEffect(() => {
                let interval;
                if (timerActive && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => prev - 1);
                    }, 1000);
                } else if (timeLeft === 0 && timerActive) {
                    setTimerActive(false);
                    submitTest();
                }
                return () => clearInterval(interval);
            }, [timerActive, timeLeft]);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const handleStart = (e) => {
                e.preventDefault();
                if(user.name && user.date) {
                    setStep(1);
                    setTimerActive(true);
                }
            };

            const handleAnswer = (qNum, val) => {
                // Prevent changing if section is already checked
                const currentPart = step;
                if(checkedStatus[currentPart]) return;
                
                setAnswers(prev => ({ ...prev, [qNum]: val }));
            };

            const checkSection = (partNum) => {
                setCheckedStatus(prev => ({ ...prev, [partNum]: true }));
            };

            const calculateResults = () => {
                let correctCount = 0;
                let sectionScores = { 1: 0, 2: 0, 3: 0, 4: 0 };
                
                // Parts 1, 2, 4
                [1, 2, 4].forEach(part => {
                    SECTION_QUESTIONS[part].forEach(q => {
                        if (answers[q] === ANSWER_KEYS[q]) {
                            correctCount++;
                            sectionScores[part]++;
                        }
                    });
                });

                // Part 3
                SECTION_QUESTIONS[3].forEach(q => {
                    if (checkPart3Answer(q, answers[q])) {
                        correctCount++;
                        sectionScores[3]++;
                    }
                });

                const percentage = Math.round((correctCount / TOTAL_QUESTIONS) * 100);

                return {
                    correctCount,
                    total: TOTAL_QUESTIONS,
                    percentage,
                    sectionScores
                };
            };

            const generateRecommendations = (scores) => {
                const recs = [];
                const p1Pct = scores[1] / 7;
                const p2Pct = scores[2] / 6;
                const p3Pct = scores[3] / 6;
                const p4Pct = scores[4] / 6;

                // Pool of recommendations based on section performance
                if (p1Pct < 0.7) {
                    recs.push("Review vocabulary related to everyday objects and daily activities (Part 1 focus).");
                    recs.push("Practice identifying key differences between visual options while listening.");
                } else {
                    recs.push("Excellent work on identifying specific information from short dialogues!");
                }

                if (p2Pct < 0.7) {
                    recs.push("Focus on understanding the attitudes and opinions of speakers in short conversations.");
                    recs.push("Listen to English podcasts and try to identify how the speakers feel about the topic.");
                } else {
                    recs.push("Great job understanding speakers' attitudes and agreements (Part 2).");
                }

                if (p3Pct < 0.7) {
                    recs.push("Practice spelling common words and writing down specific details like numbers and dates.");
                    recs.push("Work on predicting the type of missing information before the audio starts.");
                } else {
                    recs.push("Strong spelling and detail-extraction skills shown in Part 3!");
                }

                if (p4Pct < 0.7) {
                    recs.push("Build stamina for longer audio recordings by listening to extended interviews.");
                    recs.push("Practice distinguishing between general topics and detailed meaning in longer texts.");
                } else {
                    recs.push("Fantastic focus and comprehension during the long interview section!");
                }

                // Generic strong recommendations to reach 8 total
                const generalRecs = [
                    "Expose yourself to different English accents (British, American, Australian).",
                    "Read the questions carefully before the audio begins to anticipate answers.",
                    "Don't get stuck on one word you don't know; focus on the overall meaning.",
                    "Watch English movies or series with English subtitles, then try without them.",
                    "Practice taking quick, brief notes while listening.",
                    "Review incorrect answers thoroughly to understand why the correct answer is right."
                ];

                while (recs.length < 8) {
                    const randomRec = generalRecs[Math.floor(Math.random() * generalRecs.length)];
                    if (!recs.includes(randomRec)) {
                        recs.push(randomRec);
                    }
                }

                return recs.slice(0, 8);
            };

            const submitTest = () => {
                setTimerActive(false);
                const res = calculateResults();
                const recs = generateRecommendations(res.sectionScores);
                setResultsData({ ...res, recommendations: recs });
                setStep(5);
                window.scrollTo(0, 0);
            };

            const exportPDF = () => {
                setGeneratingPDF(true);
                setTimeout(() => {
                    const element = document.getElementById('pdf-content');
                    const opt = {
                        margin:       0.5,
                        filename:     `Listening_Test_${user.name.replace(/\s+/g, '_')}.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2, useCORS: true },
                        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
                    };

                    document.body.classList.add('pdf-mode');
                    
                    html2pdf().set(opt).from(element).save().then(() => {
                        document.body.classList.remove('pdf-mode');
                        setGeneratingPDF(false);
                    });
                }, 500);
            };

            const isCorrect = (qNum) => {
                if(qNum >= 14 && qNum <= 19) {
                    return checkPart3Answer(qNum, answers[qNum]);
                }
                return answers[qNum] === ANSWER_KEYS[qNum];
            };

            // ---- UI RENDER FUNCTIONS ----

            const renderHeader = () => (
                <header className="bg-[#0B0F19] border-b border-primary/30 text-white p-4 shadow-[0_4px_20px_rgba(0,240,255,0.15)] sticky top-0 z-50 backdrop-blur-md">
                    <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h1 className="text-xl md:text-2xl font-display font-bold text-primary drop-shadow-[0_0_8px_rgba(0,240,255,0.8)]">Mr. Rocha's English Class</h1>
                            <p className="text-sm text-secondary font-medium tracking-wider uppercase">B1 Listening Protocol</p>
                        </div>
                        {step > 0 && step < 5 && (
                            <div className="flex items-center gap-6">
                                <div className="text-right">
                                    <p className="text-xs text-gray-400 uppercase tracking-widest">Operator</p>
                                    <p className="font-semibold text-accent drop-shadow-[0_0_5px_rgba(0,255,159,0.5)]">{user.name}</p>
                                </div>
                                <div className={`flex items-center gap-2 px-4 py-2 rounded-lg font-mono text-xl border ${timeLeft < 300 ? 'bg-danger/20 text-danger border-danger shadow-[0_0_15px_rgba(255,0,60,0.4)]' : 'bg-primary/10 text-primary border-primary/50 shadow-[0_0_10px_rgba(0,240,255,0.3)]'}`}>
                                    <i className="fa-solid fa-clock"></i>
                                    {formatTime(timeLeft)}
                                </div>
                            </div>
                        )}
                    </div>
                </header>
            );

            const renderProgressBar = () => {
                if(step === 0 || step === 5) return null;
                return (
                    <div className="max-w-4xl mx-auto mt-6 px-4">
                        <div className="flex justify-between mb-2">
                            {[1,2,3,4].map(p => (
                                <span key={p} className={`text-sm font-bold uppercase tracking-wider ${step >= p ? 'text-primary drop-shadow-[0_0_5px_rgba(0,240,255,0.5)]' : 'text-slate-600'}`}>Sector {p}</span>
                            ))}
                        </div>
                        <div className="h-2 w-full bg-slate-800 rounded-full overflow-hidden flex border border-slate-700">
                            {[1,2,3,4].map(p => (
                                <div key={p} className={`h-full flex-1 border-r border-slate-900 transition-all duration-500 ${step > p ? 'bg-secondary shadow-[0_0_10px_#B026FF]' : step === p ? 'bg-primary shadow-[0_0_10px_#00F0FF]' : 'bg-transparent'}`}></div>
                            ))}
                        </div>
                    </div>
                );
            };

            const renderNavigationButtons = (partNum) => {
                const isChecked = checkedStatus[partNum];
                return (
                    <div className="flex flex-wrap justify-between items-center mt-12 pt-6 border-t border-slate-700/50 gap-4">
                        <button 
                            onClick={() => { setStep(step - 1); window.scrollTo(0, 0); }}
                            className="px-6 py-3 rounded-lg font-semibold text-gray-400 bg-slate-800 hover:text-white hover:border-primary/50 border border-slate-700 transition-all"
                            disabled={step === 1}
                        >
                            <i className="fa-solid fa-arrow-left mr-2"></i> Previous
                        </button>

                        {!isChecked ? (
                            <button 
                                onClick={() => checkSection(partNum)}
                                className="px-8 py-3 rounded-lg font-semibold text-white bg-secondary hover:bg-[#9015E0] shadow-[0_0_15px_rgba(176,38,255,0.5)] transition-all"
                            >
                                <i className="fa-solid fa-microchip mr-2"></i> Verify Data
                            </button>
                        ) : (
                            <span className="px-6 py-3 rounded-lg font-semibold text-accent bg-accent/10 border border-accent/30 shadow-[0_0_10px_rgba(0,255,159,0.2)]">
                                <i className="fa-solid fa-lock mr-2"></i> Data Locked
                            </span>
                        )}

                        {step < 4 ? (
                            <button 
                                onClick={() => { setStep(step + 1); window.scrollTo(0, 0); }}
                                className="px-6 py-3 rounded-lg font-bold text-black bg-primary hover:bg-[#00D0E0] shadow-[0_0_15px_rgba(0,240,255,0.6)] transition-all"
                            >
                                Next <i className="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        ) : (
                            <button 
                                onClick={submitTest}
                                className="px-8 py-3 rounded-lg font-bold text-white bg-gradient-to-r from-primary to-secondary hover:opacity-90 shadow-[0_0_20px_rgba(0,240,255,0.6)] transition-all"
                            >
                                Initialize Uplink <i className="fa-solid fa-satellite-dish ml-2"></i>
                            </button>
                        )}
                    </div>
                );
            };

            const renderOptionButton = ({ qNum, val, text, isImage = false }) => {
                const isSelected = answers[qNum] === val;
                const isChecked = checkedStatus[step];
                const correctAns = ANSWER_KEYS[qNum];
                const isActuallyCorrect = isSelected && correctAns === val;
                const isActuallyWrong = isSelected && correctAns !== val;
                const missedCorrect = !isSelected && correctAns === val && isChecked;

                let btnClass = "relative w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex items-center gap-4 ";
                if (isImage) {
                    btnClass = "relative flex-1 p-3 rounded-xl border-2 transition-all duration-200 font-bold text-center justify-center ";
                }

                if (!isChecked) {
                    btnClass += isSelected ? "border-primary bg-primary/10 text-primary shadow-[0_0_15px_rgba(0,240,255,0.3)]" : "border-slate-700 bg-slate-800/50 hover:border-primary/50 hover:bg-slate-800 hover:shadow-[0_0_15px_rgba(0,240,255,0.1)] text-gray-300";
                } else {
                    if (isActuallyCorrect) btnClass += "border-accent bg-accent/10 text-accent shadow-[0_0_15px_rgba(0,255,159,0.3)]";
                    else if (isActuallyWrong) btnClass += "border-danger bg-danger/10 text-danger shadow-[0_0_15px_rgba(255,0,60,0.3)]";
                    else if (missedCorrect) btnClass += "border-accent border-dashed bg-transparent text-accent";
                    else btnClass += "border-slate-800 bg-slate-900/50 text-slate-600 opacity-50";
                }

                return (
                    <button 
                        onClick={() => handleAnswer(qNum, val)}
                        disabled={isChecked}
                        className={btnClass}
                    >
                        <span className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm border ${
                            !isChecked ? (isSelected ? 'bg-primary text-black border-primary drop-shadow-[0_0_5px_rgba(0,0,0,0.5)]' : 'bg-slate-700 text-gray-400 border-slate-600') :
                            (isActuallyCorrect || missedCorrect ? 'bg-accent text-black border-accent drop-shadow-[0_0_5px_rgba(0,0,0,0.5)]' : (isActuallyWrong ? 'bg-danger text-white border-danger drop-shadow-[0_0_5px_rgba(0,0,0,0.5)]' : 'bg-slate-800 text-slate-500 border-slate-700'))
                        }`}>
                            {val}
                        </span>
                        {text && <span className="flex-1 font-medium">{text}</span>}
                        
                        {isChecked && isActuallyCorrect && <i className="fa-solid fa-check text-accent drop-shadow-[0_0_5px_rgba(0,255,159,0.8)] absolute right-4 text-xl"></i>}
                        {isChecked && isActuallyWrong && <i className="fa-solid fa-xmark text-danger drop-shadow-[0_0_5px_rgba(255,0,60,0.8)] absolute right-4 text-xl"></i>}
                        {isChecked && missedCorrect && <i className="fa-solid fa-arrow-left text-accent drop-shadow-[0_0_5px_rgba(0,255,159,0.8)] absolute right-4"></i>}
                    </button>
                );
            };

            const renderImageFallback = ({ src, alt, className = "max-w-sm h-48" }) => (
                <div className={`w-full mx-auto bg-slate-800/50 rounded-lg border-2 border-dashed border-slate-600 flex flex-col items-center justify-center mb-4 overflow-hidden relative group ${className}`}>
                    <img src={src} alt={alt} className="absolute inset-0 w-full h-full object-contain z-10" onError={(e) => e.target.style.display = 'none'} />
                    <i className="fa-solid fa-satellite text-4xl text-slate-500 mb-2"></i>
                    <span className="text-slate-400 font-medium font-mono text-sm tracking-widest">{src}</span>
                </div>
            );

            // --- SCREENS ---

            const renderIntroScreen = () => (
                <div className="min-h-[80vh] flex items-center justify-center p-4">
                    <div className="glass-panel futuristic-border p-8 md:p-12 rounded-2xl max-w-lg w-full text-center relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-primary rounded-full mix-blend-screen filter blur-[80px] opacity-20 transform translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
                        <div className="w-24 h-24 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-6 border border-primary/30 shadow-[0_0_30px_rgba(0,240,255,0.2)]">
                            <i className="fa-solid fa-radar text-5xl text-primary drop-shadow-[0_0_8px_rgba(0,240,255,0.8)]"></i>
                        </div>
                        <h2 className="text-3xl font-display font-bold text-white mb-2 tracking-wide">B1 Listening Protocol</h2>
                        <p className="text-primary/80 font-mono mb-8 tracking-widest text-sm uppercase">40 Mins • 4 Sectors • 25 Nodes</p>
                        
                        <form onSubmit={handleStart} className="space-y-6 text-left relative z-10">
                            <div>
                                <label className="block text-sm font-semibold text-gray-300 mb-2 uppercase tracking-wider">Operator Identity</label>
                                <div className="relative">
                                    <i className="fa-solid fa-user-astronaut absolute left-4 top-1/2 -translate-y-1/2 text-primary"></i>
                                    <input 
                                        type="text" 
                                        required
                                        className="w-full pl-11 pr-4 py-3 rounded-lg bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-primary focus:border-primary focus:shadow-[0_0_15px_rgba(0,240,255,0.3)] transition-all outline-none"
                                        placeholder="Enter designation"
                                        value={user.name}
                                        onChange={e => setUser({...user, name: e.target.value})}
                                    />
                                </div>
                            </div>
                            
                            <div>
                                <label className="block text-sm font-semibold text-gray-300 mb-2 uppercase tracking-wider">Star Date</label>
                                <div className="relative">
                                    <input 
                                        type="date" 
                                        required
                                        className="w-full px-4 py-3 rounded-lg bg-slate-900/80 border border-slate-700 text-white focus:ring-2 focus:ring-primary focus:border-primary focus:shadow-[0_0_15px_rgba(0,240,255,0.3)] transition-all outline-none"
                                        style={{ colorScheme: 'dark' }}
                                        value={user.date}
                                        onChange={e => setUser({...user, date: e.target.value})}
                                    />
                                </div>
                            </div>

                            {renderImageFallback({ src: "imagea.jpg", alt: "Intro Graphic" })}

                            <button type="submit" className="w-full py-4 rounded-lg font-bold text-black bg-primary hover:bg-[#00D0E0] shadow-[0_0_20px_rgba(0,240,255,0.4)] hover:shadow-[0_0_30px_rgba(0,240,255,0.6)] transition-all text-lg flex items-center justify-center gap-3 uppercase tracking-wider">
                                Initiate Sequence <i className="fa-solid fa-rocket"></i>
                            </button>
                        </form>
                    </div>
                </div>
            );

            const renderPart1 = () => (
                <div className="max-w-4xl mx-auto p-4 py-8 animate-fade-in">
                    <div className="bg-card rounded-2xl shadow-[0_0_30px_rgba(0,240,255,0.05)] border border-primary/20 p-6 md:p-8 mb-8">
                        <h2 className="text-2xl font-display font-bold text-white mb-2 flex items-center gap-3">
                            <span className="bg-primary text-black w-8 h-8 rounded-lg flex items-center justify-center text-sm shadow-[0_0_10px_rgba(0,240,255,0.5)]">1</span>
                            Sector 1
                        </h2>
                        <p className="text-gray-400 mb-6 font-medium">Nodes 1 – 7. For each node, engage sequence A, B, or C.</p>
                        
                        <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-700 shadow-inner mb-8">
                            <div className="flex items-center gap-3 mb-2 text-sm font-semibold text-primary drop-shadow-[0_0_5px_rgba(0,240,255,0.5)]">
                                <i className="fa-solid fa-satellite-dish"></i> Access Audio Uplink 1
                            </div>
                            <audio controls src="audio1.mp3">Your browser does not support the audio element.</audio>
                        </div>

                        <div className="space-y-12">
                            {[
                                { q: 1, text: "What did the girl buy on her shopping trip?", img: "image1.jpg" },
                                { q: 2, text: "Why did the plane leave late?", img: "image2.jpg" },
                                { q: 3, text: "What activity does the woman want to book for the weekend?", img: "image3.jpg" },
                                { q: 4, text: "Which cake will the girl order?", img: "image4.jpg" },
                                { q: 5, text: "How much must customers spend to get a free gift?", img: "image5.jpg" },
                                { q: 6, text: "What did the family do on Sunday?", img: "image6.jpg" },
                                { q: 7, text: "Which programme is on first?", img: "image7.jpg" }
                            ].map((item) => (
                                <div key={item.q} className="bg-slate-800/30 rounded-xl p-6 border border-slate-700/50 shadow-inner">

                                                }
                                            </td>
                                            <td style={{ padding: '10px', color: '#cbd5e1' }}>{keyStr}</td>
                                        </tr>
                                    )
                                })}
                            </tbody>
                        </table>
                        
                        <div style={{ marginTop: '40px', textAlign: 'center', fontSize: '11px', color: '#475569', letterSpacing: '2px', textTransform: 'uppercase' }}>
                            Encoded via Mr. Rocha's Assessment Protocol • {new Date().toLocaleString()}
                        </div>
                    </div>
                );
            };

            return (
                <div className="font-sans text-gray-200 min-h-screen pb-20">
                    {renderHeader()}
                    {renderProgressBar()}
                    
                    <main>
                        {step === 0 && renderIntroScreen()}
                        {step === 1 && renderPart1()}
                        {step === 2 && renderPart2()}
                        {step === 3 && renderPart3()}
                        {step === 4 && renderPart4()}
                        {step === 5 && renderResultsScreen()}
                    </main>

                    {step === 5 && (
                        <div id="pdf-container">
                            {renderPdfTemplate()}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
